name: 构建 RAGFlow arm64 镜像
on:
  workflow_dispatch:
    inputs:
      version:
        description: "RAGFlow 版本 tag，如 v0.27.2"
        required: true
        default: "v0.27.2"
permissions:
  contents: read
  packages: write
jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    env:
      VERSION: ${{ github.event.inputs.version }}
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION }}
      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建 arm64 base 镜像
        run: |
          docker build -f Dockerfile.base -t infiniflow/ragflow-base:${{ env.VERSION }} .
      - name: 构建并推送 arm64 主镜像
        run: |
          docker build -f Dockerfile -t ${IMAGE}:${{ env.VERSION }}-arm64 .
          docker push ${IMAGE}:${{ env.VERSION }}-arm64
