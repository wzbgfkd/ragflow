name: 构建 RAGFlow arm64（最新版）
on:
  workflow_dispatch:
    inputs:
      version:
        description: "RAGFlow 版本 tag（如 v0.27.2），留空则用 main"
        required: false
        default: ""
permissions:
  contents: read
  packages: write
jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      VERSION: ${{ github.event.inputs.version || 'nightly' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version }}
          fetch-depth: 0
          fetch-tags: true
      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 安装 C++ 编译工具链（build.sh --cpp 需要）
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libpcre2-dev pkg-config
      - name: 登录 ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 下载 Go 链接的原生静态库
        run: |
          cd ragflow_deps
          pip install uv || true
          uv sync || true
          uv run python3 download_go_deps.py || python3 download_go_deps.py
          cd ..
      - name: 编译 C++ 静态库 + Go 二进制（arm64）
        run: |
          ./build.sh --cpp
          ./build.sh --go
      - name: 构建 ragflow_deps（arm64）
        run: |
          cd ragflow_deps
          uv run python3 download_deps.py || python3 download_deps.py
          docker build -f Dockerfile -t infiniflow/ragflow_deps .
          cd ..
      - name: 构建并推送主镜像（arm64）
        run: |
          docker build -f Dockerfile -t ${IMAGE}:${VERSION}-arm64 .
          docker push ${IMAGE}:${VERSION}-arm64
