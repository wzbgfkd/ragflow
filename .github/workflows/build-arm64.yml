name: 构建 RAGFlow arm64（v0.20.5）
on:
  workflow_dispatch:
jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      VERSION: v0.20.5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.20.5
          fetch-depth: 0
          fetch-tags: true
      - name: 登录 ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: arm64 将 xgboost 升级到 1.6.0
        run: |
          sed -i 's/xgboost *=.*/xgboost = "1.6.0"/' pyproject.toml
          grep xgboost pyproject.toml
      - name: 下载依赖资源
        run: |
          pip install uv || true
          uv run python3 download_deps.py || python3 download_deps.py
      - name: 构建 deps 镜像
        run: |
          docker build -f Dockerfile.deps -t infiniflow/ragflow_deps .
      - name: 构建并推送 arm64 主镜像
        run: |
          docker build -f Dockerfile -t ${IMAGE}:${VERSION}-arm64 .
          docker push ${IMAGE}:${VERSION}-arm64
